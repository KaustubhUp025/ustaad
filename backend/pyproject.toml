[project]
name = "ustaad-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Pin exact versions on Day 1 after `uv lock` (spec §9). Ranges here are placeholders.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "google-genai",
  "google-adk",
  "google-cloud-aiplatform",
  "google-cloud-firestore",
  "google-cloud-storage",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
